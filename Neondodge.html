<script>

let data=Object.assign({},defaultSave,read('neonDodgeMegaSave',{}));if(!Array.isArray(data.ownedChars))data.ownedChars=[0];if(!data.ownedChars.includes(0))data.ownedChars.push(0);if(!Array.isArray(data.ownedWeapons))data.ownedWeapons=[0];if(!data.ownedWeapons.includes(0))data.ownedWeapons.push(0);if(!data.ownedChars.includes(data.char))data.char=0;if(!data.ownedWeapons.includes(data.weapon))data.weapon=0;if(!data.up||typeof data.up!=='object')data.up={};

function hud(){$('score').textContent=Math.floor(score);$('hp').textContent=hp+(shield?' 🛡'+shield:'');$('coins').textContent=data.coins;$('gems').textContent=data.gems;$('best').textContent=data.best;$('bossPanel').classList.toggle('hidden',!boss);if(boss){$('bossName').textContent=boss.icon+' '+boss.name;$('bossNum').textContent=Math.ceil(boss.hp)+'/'+boss.max;$('bossFill').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}}

function openView(v){view=v;$('panel').classList.remove('hidden');$('panelTitle').textContent=({gacha:'🎰 キャラクターガチャ',chars:'🧑 キャラ図鑑',weapons:'⚔️ 武器ショップ',upgrade:'⬆️ 永続強化',missions:'📜 ミッション',achievements:'🏅 実績',bosses:'👾 ボス図鑑',story:'📖 ストーリーモード',secrets:'🔒 隠しボス',training:'📈 キャラクター育成',evolution:'🛠️ 武器進化',dungeons:'🏰 ダンジョン',rebirth:'♻️ 転生'})[v];renderView();$('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function node(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function renderView(){let box=$('panelBody');box.replaceChildren();box.append(node('p','🪙 '+data.coins+'　💎 '+data.gems+'　※プレイ中は購入・変更できません','small'));

if(view==='rebirth'){let cost=1500+data.rebirths*1000;box.append(node('p','転生回数：'+data.rebirths+'回　永続効果：最大HP +'+data.rebirths+'、攻撃力 +'+(data.rebirths*4)));box.append(node('p','条件：累計ボス撃破 '+(10+data.rebirths*5)+'体以上、コイン '+cost+'枚'));box.append(node('p','転生後もキャラ・武器・レベル・進化・図鑑は引き継ぎます。コインのみ消費します。','small'));addBtn(box,'♻️ 転生する',()=>{if(running||data.totalKills<10+data.rebirths*5||data.coins<cost)return;data.coins-=cost;data.rebirths++;save();hud();renderView();notice('転生成功！ 永続ステータスアップ！')},running||data.totalKills<10+data.rebirths*5||data.coins<cost)}

if(view==='missions'){box.append(node('p','🎯 1プレイごとの任務。達成すると次の任務が解放され、何度でも挑戦できます。','small'));
let tasks=[['コインを5枚集める','coins',5,50],['スコア100を達成','score',100,75],['敵の攻撃を15回避ける','dodge',15,90],['ボスを1体倒す','boss',1,120],['コインを15枚集める','coins',15,150],['スコア500を達成','score',500,220],['ボスを3体倒す','boss',3,300],['敵の攻撃を40回避ける','dodge',40,350]];
let i=data.missionIndex%tasks.length,[name,type,goal,reward]=tasks[i];let progress=Number(data.missionProgress)||0;box.append(node('h3','任務 '+(data.missionIndex+1)+'：'+name));box.append(node('p','進捗：'+Math.min(progress,goal)+' / '+goal));box.append(node('p','達成報酬：🪙 '+reward));addBtn(box,progress>=goal?'🎁 報酬を受け取り次へ':'プレイして達成しよう',()=>{data.coins+=reward;data.missionIndex++;data.missionProgress=0;save();hud();renderView()},progress<goal||running)}
if(view==='achievements'){box.append(node('p','🏆 一度達成すると永久に残る偉業。報酬は各実績につき一度だけ。','small'));
let achievements=[['a1','初めての勝利',data.totalKills,1,2,'ボスハンター'],['a2','伝説の討伐者',data.totalKills,50,10,'伝説の勇者'],['a3','大富豪',data.totalCoins,5000,12,'黄金の王'],['a4','収集家',data.ownedChars.length,30,20,'キャラマスター'],['a5','武器職人',data.ownedWeapons.length,25,20,'武器マスター'],['a6','世界の救世主',data.storyCleared,5,15,'救世主'],['a7','深淵を見た者',data.secretWins.length,3,30,'隠された覇者'],['a8','転生者',data.rebirths,3,15,'輪廻の旅人'],['a9','究極の挑戦者',data.hardBossWins,10,15,'裏ボスキラー']];
for(let [id,name,value,goal,gems,title] of achievements){let card=node('div',undefined,'card');card.append(node('b',name));card.append(node('div',Math.min(value,goal)+' / '+goal+'　💎'+gems+'・称号「'+title+'」','small'));let claimed=data.achievementsClaimed.includes(id);addBtn(card,claimed?'🏅 獲得済み':value>=goal?'🏆 実績を受け取る':'未達成',()=>{data.achievementsClaimed.push(id);data.gems+=gems;data.titles.push(title);save();hud();renderView()},claimed||value<goal);grid.append(card)}}}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openView(b.dataset.view));$('closePanel').onclick=()=>$('panel').classList.add('hidden');
function begin(newMode='normal',di=0){mode=newMode;dungeonIndex=di;dungeonStage=0;hardMode=false;cancelAnimationFrame(raf);running=true;paused=false;last=0;elapsed=0;score=0;hp=maxHP();shield=up('shield');player.x=210;items=[];bullets=[];boss=null;bossCount=0;spawn=0;fire=0;inv=0;runCoins=0;runCollected=0;runDodged=0;secretIndex=di;data.totalRuns++;save();$('overlay').classList.add('hidden');$('panel').classList.add('hidden');hud();raf=requestAnimationFrame(loop)}
function finish(){running=false;cancelAnimationFrame(raf);if(Math.floor(score)>data.best)data.best=Math.floor(score);save();hud();$('overlayTitle').textContent='ゲームオーバー！';$('overlayText').innerHTML='⭐ スコア：'+Math.floor(score)+'<br>🪙 今回獲得：'+runCoins+'<br>👾 撃破ボス：'+bossCount+'<br>🏆 最高記録：'+data.best;$('play').textContent='↻ もう一度遊ぶ';$('overlay').classList.remove('hidden')}
function pause(){if(!running)return;paused=!paused;if(paused){cancelAnimationFrame(raf);$('overlayTitle').textContent='一時停止';$('overlayText').textContent='準備ができたら再開しよう';$('play').textContent='▶ 再開';$('overlay').classList.remove('hidden')}else{$('overlay').classList.add('hidden');last=0;raf=requestAnimationFrame(loop)}}
$('play').onclick=()=>running&&paused?pause():begin();$('pause').onclick=pause;
let keys={};window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' '].includes(k))e.preventDefault();keys[k]=true;if(k===' '&&!e.repeat)pause()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};if(running&&!paused)pause()});
for(let [id,k] of [['left','arrowleft'],['right','arrowright']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
let dragging=false,lastPointerX=0,activePointerId=null;
canvas.addEventListener('pointerdown',e=>{if(!running||paused||dragging)return;e.preventDefault();dragging=true;activePointerId=e.pointerId;lastPointerX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointerId||!running||paused)return;e.preventDefault();const rect=canvas.getBoundingClientRect();const delta=(e.clientX-lastPointerX)*420/rect.width;lastPointerX=e.clientX;player.x=Math.max(20,Math.min(400,player.x+delta))});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(e.pointerId===activePointerId){dragging=false;activePointerId=null}});
function spawnBoss(){let d=dungeons[dungeonIndex];let index=mode==='dungeon'?(d.boss+dungeonStage)%bosses.length:mode==='story'?[0,1,2,3,19][dungeonIndex]:mode==='secret'?[15,17,19][secretIndex]:bossCount%20;let b=bosses[index];hardMode=mode==='normal'&&bossCount%5===4;let mult=mode==='dungeon'?d.enemy*(1+dungeonStage*.4):mode==='secret'?[5,9,15][secretIndex]:mode==='story'?1.4+dungeonIndex*.6:hardMode?4:1;
let max=Math.floor((80+bossCount*35)*(1+bossCount*.13)*mult);boss={...b,x:210,y:83,hp:max,max,t:0,fire:900};notice((hardMode?'💀 超高難易度ボス！ ':mode==='dungeon'?'🏰 階層'+(dungeonStage+1)+' ':'👾 ')+b.name+' 出現！')}
function draw(){ctx.fillStyle='#0b1128';ctx.fillRect(0,0,420,560);ctx.strokeStyle='#25375b';ctx.lineWidth=1;for(let x=0;x<420;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,560);ctx.stroke()}for(let y=(elapsed*.06)%42;y<560;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(420,y);ctx.stroke()}
for(let it of items){ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fillStyle=it.type==='coin'?'#ffdd55':it.type==='enemy'?'#ff4e76':'#fa82d6';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;if(it.type==='coin'){ctx.font='bold 14px system-ui';ctx.fillStyle='#745600';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',it.x,it.y)}}
if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowColor=boss.color;ctx.shadowBlur=25;ctx.fillStyle=hardMode?'#ff285b':boss.color;ctx.beginPath();for(let i=0;i<12;i++){let a=i*Math.PI/6,r=i%2?31:42;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText(boss.icon,0,8);ctx.restore()}
for(let s of bullets){ctx.fillStyle='#8dffb9';ctx.shadowColor='#8dffb9';ctx.shadowBlur=10;ctx.fillRect(s.x-3,s.y-11,6,16);ctx.shadowBlur=0}
if(inv<=0||Math.floor(inv/100)%2===0){ctx.beginPath();ctx.moveTo(player.x,player.y-22);ctx.lineTo(player.x-19,player.y+17);ctx.lineTo(player.x+19,player.y+17);ctx.closePath();ctx.fillStyle=char().color;ctx.shadowColor=char().color;ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0}
if(shield){ctx.strokeStyle='#8abaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,27,0,Math.PI*2);ctx.stroke()}}
function loop(t){if(!running||paused)return;let dt=last?Math.min(40,t-last):16;last=t;elapsed+=dt;score+=dt*.01;inv-=dt;let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);player.x=Math.max(20,Math.min(400,player.x+dir*dt*(.34+.045*(up('speed')+char().speed))));
if(!boss&&elapsed>=(mode==='dungeon'?dungeons[dungeonIndex].time*(dungeonStage+1):mode==='story'||mode==='secret'?5000:20000*(bossCount+1))&&!(mode==='story'&&bossCount>0))spawnBoss();
spawn-=dt;if(spawn<=0){let isCoin=Math.random()<.34;items.push({x:20+Math.random()*380,y:-20,r:isCoin?12:15+Math.random()*6,type:isCoin?'coin':'enemy',vx:0,vy:0});spawn=Math.max(200,680-elapsed*.004)}
if(boss){boss.t+=dt;boss.x=210+125*Math.sin(boss.t*(.0013+boss.pattern*.00025));boss.fire-=dt;if(boss.fire<=0){let count=3+boss.pattern*2+(hardMode?4:0)+(mode==='secret'?secretIndex*3+3:0);for(let j=0;j<count;j++){let spread=(j-(count-1)/2)*26;items.push({x:boss.x,y:boss.y+28,r:9,type:'bullet',vx:spread/120,vy:3.3+bossCount*.14})}boss.fire=Math.max(190,(1050-bossCount*20)*(mode==='secret'?.45:hardMode?.52:mode==='dungeon'?.8:1))}fire-=dt;if(fire<=0){let w=weapon();for(let j=0;j<w.count;j++)bullets.push({x:player.x+(j-(w.count-1)/2)*15,y:player.y-22});fire=w.interval}}
for(let i=bullets.length-1;i>=0;i--){let s=bullets[i];s.y-=dt*.65;if(boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<40){let damage=attack();if(Math.random()<up('crit')*.035)damage*=2;boss.hp-=damage;bullets.splice(i,1);if(boss.hp<=0){let defeated=boss;boss=null;bossCount++;data.totalKills++;if(hardMode){data.hardBossWins++;data.gems+=3;notice('💀 裏ボス撃破！ 💎+3')} if(!data.defeated.includes(defeated.id))data.defeated.push(defeated.id);let reward=(25+bossCount*10)*(1+up('income'));coin(reward);runCoins+=reward;data.gems+=bossCount%3===0?1:0;hp=Math.min(maxHP(),hp+up('regen'));score+=100*bossCount;
if(mode==='story'||mode==='secret'){let isStory=mode==='story',idx=isStory?dungeonIndex:secretIndex;if(isStory&&data.storyCleared===idx)data.storyCleared=idx+1;if(!isStory&&!data.secretWins.includes(idx))data.secretWins.push(idx);let bonus=isStory?150+idx*120:800+idx*700;coin(bonus);data.gems+=isStory?idx+1:10+idx*5;save();hud();running=false;cancelAnimationFrame(raf);$('overlayTitle').textContent=isStory?'📖 第'+(idx+1)+'章クリア！':'🏆 隠しボス撃破！';$('overlayText').textContent=isStory?(idx===4?'ネオンの光が世界に戻った！ 真の敵がまだ潜んでいる…':'次の章が解放された！'):('隠しボスを撃破！ 特別報酬 🪙'+bonus);$('play').textContent='▶ 通常モードへ';$('overlay').classList.remove('hidden');bullets=[];return}
if(mode==='dungeon'){dungeonStage++;if(dungeonStage>=3){let di=dungeonIndex,d=dungeons[di];let first=!(data.dungeonClears[di]>0);data.dungeonClears[di]=(data.dungeonClears[di]||0)+1;if(first){coin(d.reward);data.gems+=di+1}save();bullets=[];hud();running=false;cancelAnimationFrame(raf);$('overlayTitle').textContent='🏰 ダンジョンクリア！';$('overlayText').textContent=d.name+' を攻略！ '+(first?'初回報酬 🪙'+d.reward+' 💎'+(di+1):'再クリア達成！');$('play').textContent='▶ 通常モードへ';$('overlay').classList.remove('hidden');return}}save();notice('🎉 '+defeated.name+' 撃破！ 🪙+'+reward);bullets=[];break}}else if(s.y<0)bullets.splice(i,1)}
for(let i=items.length-1;i>=0;i--){let it=items[i];if(it.type==='coin'&&up('magnet')){let d=Math.hypot(it.x-player.x,it.y-player.y);if(d<50+up('magnet')*28&&d>1){it.x+=(player.x-it.x)/d*dt*.3;it.y+=(player.y-it.y)/d*dt*.3}}it.x+=(it.vx||0)*dt/16;it.y+=(it.type==='bullet'?it.vy:2.5+Math.min(5,elapsed/17000))*dt/16;if(it.y>590){if(it.type!=='coin')runDodged++;items.splice(i,1);continue}if(Math.hypot(it.x-player.x,it.y-player.y)<it.r+player.r-4){if(it.type==='coin'){let gain=1+up('income');coin(gain);runCoins+=gain;runCollected++;score+=10;items.splice(i,1)}else if(inv<=0){if(shield)shield--;else hp--;inv=1100;items.splice(i,1);if(hp<=0){draw();finish();return}}}}
if(mode==='normal'){let tasks=[['coins',5],['score',100],['dodge',15],['boss',1],['coins',15],['score',500],['boss',3],['dodge',40]];let [kind,goal]=tasks[data.missionIndex%tasks.length];let value=kind==='coins'?runCollected:kind==='score'?Math.floor(score):kind==='dodge'?runDodged:bossCount;if(value>data.missionProgress){data.missionProgress=Math.min(goal,value);save()}}if(Math.floor(score)>data.best){data.best=Math.floor(score);save()}hud();draw();raf=requestAnimationFrame(loop)}
hud();draw();
</script></body></html>
