<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Skeleton Battle — Final Phase V6</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:white;font-family:monospace;text-align:center}h2{font-size:18px;margin:12px}canvas{display:block;width:min(100vw,640px);height:auto;margin:auto;image-rendering:pixelated;touch-action:none}.controls{display:flex;justify-content:space-around;align-items:center;max-width:600px;margin:10px auto;gap:8px}.dpad{display:grid;grid-template-columns:repeat(3,54px);gap:3px}.dpad button:first-child{grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{background:#222;border:2px solid #aaa;color:white;border-radius:8px;min-height:48px;font-size:18px;touch-action:none}.actions{display:flex;gap:8px}.actions button{padding:0 16px}p{color:#aaa;font-size:12px}</style></head><body><h2>☠ BAD TIME BATTLE — SCRIPTED EDITION V5 ☠</h2><canvas id="game" width="640" height="480"></canvas><div style="color:#ddd;font-size:12px;max-width:630px;margin:4px auto">← → でコマンド選択 / Z・Enterで決定 / Xで戻る　・　青いハートは壁から反対方向へジャンプ</div><div class="controls"><div class="dpad"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><div class="actions"><button data-k="z">決定 Z</button><button data-k="x">戻る X</button></div></div><p>青い骨は静止、オレンジの骨は移動で回避。緑の足場に乗れます。</p><p>矢印 / WASD：移動　Z / Enter：決定　X：戻る　青いハート：↑でジャンプ</p><script>
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const keys={},B={x:170,y:235,w:300,h:135},H={x:320,y:300,vx:0,vy:0,blue:false,gravity:0};
let hp=92,kr=0,turn=0,items=5,sel=0,phase='menu',frame=0,objects=[],inv=0,shake=0,flash=0,attack=0,dialog='* いやな よかんが する。',messageTimer=0,miss=0,ended=false;
const labels=['FIGHT','ACT','ITEM','MERCY'];
function reset(){hp=92;kr=0;turn=0;items=5;sel=0;phase='menu';frame=0;objects=[];inv=0;shake=0;flash=0;dialog='* いやな よかんが する。';B.x=170;B.y=235;B.w=300;B.h=135;H.blue=false;ended=false}
function setBox(w,h){B.w+=(w-B.w)*.08;B.h+=(h-B.h)*.08;B.x=320-B.w/2;B.y=302-B.h/2}
function bone(x,y,w,h,vx,vy,color=0){objects.push({kind:'bone',x,y,w,h,vx,vy,color})}
function platform(x,y,w,vx=0){objects.push({kind:'platform',x,y,w,h:8,vx,vy:0})}
function stab(side,length=45){let x=side===0?B.x:B.x+B.w-16;bone(x,B.y+12,16,length,0,0)}
function beam(x,y,angle=0,delay=38){objects.push({kind:'beam',x,y,angle,delay,life:delay+25})}
function begin(){phase='attack';frame=0;objects=[];attack=turn>=12?12:[0,1,2,3,4,6,5,7,8,9,10,11][turn%12];turn++;H.x=320;H.y=300;H.vx=0;H.vy=0;H.blue=attack===12||[1,2,3,5,6,8,9,10,11].includes(attack);H.gravity=attack===6?1:attack===8?2:attack===10?3:0;B.w=300;B.h=135;B.x=170;B.y=235;dialog='';}
function finish(){phase='menu';frame=0;objects=[];H.blue=false;dialog=['* まだ たたかいは おわらない。','* ほねが ふたたび うごきだす。','* つぎの こうげきに そなえよう。'][turn%3]}
function command(){if(phase==='dead'||phase==='win'){reset();return}if(phase==='menu'){if(sel===0){phase='fight';frame=0}else if(sel===1){dialog='* ほねの せんしは こちらを みている。';begin()}else if(sel===2){phase='item';frame=0}else{dialog='* まだ おわらせては くれない。';begin()}}else if(phase==='item'){if(items>0){items--;hp=Math.min(92,hp+35);kr=0;dialog='* HPが 35 かいふくした！';begin()}else{phase='menu';dialog='* アイテムが ない。'}}else if(phase==='fight'){miss=65;begin()}}
function gravityVector(){return [[0,1],[-1,0],[0,-1],[1,0]][H.gravity]}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function collide(o){if(o.kind==='beam'){if(o.delay>0||o.life<5)return false;let dx=H.x-o.x,dy=H.y-o.y,dist=Math.abs(-Math.sin(o.angle)*dx+Math.cos(o.angle)*dy),forward=Math.cos(o.angle)*dx+Math.sin(o.angle)*dy;return dist<16&&forward>-8&&forward<680}return rect({x:H.x-5,y:H.y-5,w:10,h:10},o)}
function spawn(){const n=Math.floor(frame),r=(a,b)=>a+Math.random()*(b-a),floor=B.y+B.h;
if(attack===0&&n%36===0){let gap=B.y+38+Math.sin(n*.055)*26;bone(B.x-22,B.y,16,gap-B.y-19,5,0);bone(B.x-22,gap+20,16,floor-gap-20,5,0)}
if(attack===1&&n%34===0){for(let i=0;i<6;i++)bone(B.x+B.w+15+i*17,floor-(i%3===0?60:28),13,i%3===0?60:28,-4.4,0)}
if(attack===2&&n%60===0){let gap=B.x+B.w/2+Math.sin(n*.065)*55;for(let x=B.x;x<B.x+B.w;x+=22)if(Math.abs(x-gap)>32)bone(x,B.y-45,12,42,0,5)}
if(attack===3&&n%100===20){beam(B.x-80,B.y+35,0,48);beam(B.x+B.w+80,floor-28,Math.PI,62)}
if(attack===4&&n%22===0){bone(B.x+18+(n*37)%(B.w-36),floor+35,13,36,0,-4.8)}
if(attack===5&&n%46===0){let gap=B.x+B.w/2+Math.sin(n*.095)*75;for(let x=B.x;x<B.x+B.w;x+=17)if(Math.abs(x-gap)>28)bone(x,floor+30,10,55,0,-5)}
if(attack===6&&n%40===0){for(let i=0;i<5;i++)bone(B.x-45-i*25,B.y+15+i%2*48,35,12,5,0)}
if(attack===7&&n%100===10){beam(B.x-80,B.y+25,0,44);beam(B.x+B.w+80,floor-25,Math.PI,60);beam(320,B.y-90,Math.PI/2,74)}
if(attack===8&&n%40===0){for(let i=0;i<7;i++)bone(B.x+B.w+30+i*20,B.y+(i%2)*48,12,45,-4.7,0)}
if(attack===9&&n%34===0){let gap=B.y+B.h/2+Math.sin(n*.08)*28;bone(B.x-25,B.y,15,gap-B.y-12,5.2,0);bone(B.x-25,gap+18,15,floor-gap-18,5.2,0)}
if(attack===10&&n%74===0){beam(320,B.y-80,Math.PI/2,44);for(let i=0;i<5;i++)bone(B.x-30-i*25,floor-25-(i%2)*40,12,25+(i%2)*40,4.6,0)}
if(attack===0&&n===110){for(let i=0;i<5;i++)bone(B.x+B.w+25+i*36,B.y+16+(i%2)*62,14,45,-4.6,0,i%2?1:2)}
if(attack===1&&n%90===5){platform(B.x+35,B.y+B.h-48,86,1.3);platform(B.x+185,B.y+B.h-80,70,-1)}
if(attack===2&&n%100===30){for(let i=0;i<5;i++)bone(B.x-25-i*35,B.y+18+(i%2)*55,12,48,4.2,0,i%2?1:2)}
if(attack===3&&n===170){beam(320,B.y-85,Math.PI/2,35)}
if(attack===4&&n%100===10){bone(B.x-20,B.y+20,16,72,5,0,1);bone(B.x+B.w+20,B.y+45,16,70,-5,0,2)}
if(attack===5&&n%100===20){platform(B.x+30,B.y+B.h-48,85,1.6);platform(B.x+170,B.y+B.h-80,85,-1.6)}
if(attack===6&&n%85===20){for(let i=0;i<4;i++)bone(B.x+B.w+15+i*28,B.y+15+(i%2)*50,12,45,-4.5,0,i%2?2:1)}
if(attack===7&&n%120===70){beam(320,B.y-80,Math.PI/2,38)}
if(attack===8&&n%90===20){platform(B.x+35,B.y+B.h-55,85,1.1)}
if(attack===9&&n%80===20){bone(B.x-30,B.y+25,16,75,5.3,0,2)}
if(attack===10&&n%100===40){for(let i=0;i<6;i++)bone(B.x+B.w+25+i*23,B.y+25+(i%2)*55,14,38,-5,0,i%2?1:2)}
// Final phase: deterministic sequences of corridor bones, rotating gravity and beam salvos.
if(attack===12){
if(n===1){H.gravity=0;dialog='* さいごの こうげきが はじまる。'}
if(n===165){H.gravity=1;H.vx=0;H.vy=0}
if(n===335){H.gravity=2;H.vx=0;H.vy=0}
if(n===505){H.gravity=3;H.vx=0;H.vy=0}
if(n===670){H.blue=false;H.vx=0;H.vy=0}
if(n<165&&n%25===0){let gap=B.y+45+Math.sin(n*.08)*28;bone(B.x-25,B.y,15,gap-B.y-18,6,0);bone(B.x-25,gap+18,15,B.y+B.h-gap-18,6,0)}
if(n>=165&&n<335&&n%26===0){for(let i=0;i<5;i++)bone(B.x+B.w+20+i*22,B.y+15+(i%2)*65,12,50,-5.5,0)}
if(n>=335&&n<505&&n%55===0){beam(320,B.y-80,Math.PI/2,46);bone(B.x-25,B.y+24,16,55,5.5,0,1)}
if(n>=505&&n<670&&n%45===0){beam(B.x+B.w+80,B.y+B.h/2,Math.PI,48);for(let i=0;i<4;i++)bone(B.x-30-i*28,B.y+20+(i%2)*55,12,50,5,0)}
if(n>=670&&n<890&&n%58===0){beam(B.x-80,B.y+24,0,42);beam(B.x+B.w+80,B.y+B.h-22,Math.PI,50)}
if(n>=670&&n<890&&n%20===0){let x=B.x+15+(n*13)%(B.w-30);bone(x,B.y-25,12,35,0,5.1)}
}
if(attack===11&&n%80===0){beam(B.x-80,B.y+30,0,45);beam(B.x+B.w+80,floor-30,Math.PI,55);for(let i=0;i<5;i++)bone(B.x+B.w+30+i*25,floor-(i%2?70:25),12,i%2?70:25,-4.7,0)}
}
function update(dt){dt=Math.min(dt,2);if(inv>0)inv-=dt;if(shake>0)shake-=dt;if(flash>0)flash-=dt;if(miss>0)miss-=dt;
if(phase==='attack'){frame+=dt;let targetW=attack===12?390:attack===7||attack===11?400:attack===4?230:300,targetH=attack===12?175:attack===7?175:attack===9?105:135;setBox(targetW,targetH);
let dx=Number(!!(keys.ArrowRight||keys.d))-Number(!!(keys.ArrowLeft||keys.a)),dy=Number(!!(keys.ArrowDown||keys.s))-Number(!!(keys.ArrowUp||keys.w));
if(H.blue){let [gx,gy]=gravityVector(),px=-gy,py=gx,side=dx*px+dy*py,jump=dx*(-gx)+dy*(-gy);H.vx+=gx*.43*dt+px*side*.75*dt;H.vy+=gy*.43*dt+py*side*.75*dt;let grounded=(gy===1&&H.y>=B.y+B.h-9)||(gy===-1&&H.y<=B.y+9)||(gx===1&&H.x>=B.x+B.w-9)||(gx===-1&&H.x<=B.x+9);if(jump>0&&grounded){H.vx=-gx*8.2;H.vy=-gy*8.2}H.vx=Math.max(-8,Math.min(8,H.vx));H.vy=Math.max(-8,Math.min(8,H.vy));H.x+=H.vx*dt;H.y+=H.vy*dt}else{H.x+=dx*3.5*dt;H.y+=dy*3.5*dt}
let nx=Math.max(B.x+9,Math.min(B.x+B.w-9,H.x)),ny=Math.max(B.y+9,Math.min(B.y+B.h-9,H.y));if(nx!==H.x)H.vx=0;if(ny!==H.y)H.vy=0;H.x=nx;H.y=ny;
if(Math.floor(frame)!==Math.floor(frame-dt))spawn();for(let o of objects){o.x+=(o.vx||0)*dt;o.y+=(o.vy||0)*dt;if(o.kind==='beam'){o.delay-=dt;o.life-=dt}if(o.kind==='platform'&&H.blue&&H.gravity===0&&H.vy>=0&&H.y>=o.y-12&&H.y<=o.y+7&&H.x>o.x-8&&H.x<o.x+o.w+8){H.y=o.y-9;H.vy=0}if(inv<=0&&o.kind!=='platform'&&collide(o)&&!(o.color===1&&Math.hypot(H.vx,H.vy)<.6&&!(keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight))&&!(o.color===2&&Math.hypot(H.vx,H.vy)>.6)){hp=Math.max(0,hp-5);kr=Math.min(10,kr+2);inv=24;shake=9;flash=8;if(hp===0){phase='dead';dialog='GAME OVER'}}}objects=objects.filter(o=>o.x>-130&&o.x<780&&o.y>-130&&o.y<590&&(o.kind!=='beam'||o.life>0));if(frame>(attack===12?920:attack===7||attack===11?560:attack===3?490:420)){if(attack===12){phase="win";dialog="* さいごの こうげきを たえぬいた！";objects=[]}else finish();}}
else if(phase==='fight'){frame+=dt;if(frame>65)begin()}if(phase==='menu'&&kr>0&&Math.floor(performance.now()/650)%2===0){kr--;hp=Math.max(1,hp-1)}}
function txt(t,x,y,size=18,color='white',align='left'){g.fillStyle=color;g.font=`bold ${size}px monospace`;g.textAlign=align;g.fillText(t,x,y)}
function drawBone(o){g.fillStyle=o.color===1?'#55dfff':o.color===2?'#ffa63c':'#fff';g.fillRect(o.x,o.y,o.w,o.h);if(o.h>o.w){g.beginPath();g.ellipse(o.x+o.w/2,o.y,o.w*.73,4,0,0,Math.PI*2);g.ellipse(o.x+o.w/2,o.y+o.h,o.w*.73,4,0,0,Math.PI*2);g.fill()}}
function drawBeam(o){g.save();g.translate(o.x,o.y);g.rotate(o.angle);g.fillStyle='#eee';g.beginPath();g.ellipse(-25,0,30,21,0,0,Math.PI*2);g.fill();g.fillStyle='#000';g.fillRect(-37,-11,25,8);g.fillRect(-37,3,25,8);if(o.delay<=0){g.fillStyle='#41caff';g.fillRect(-4,-19,690,38);g.fillStyle='#fff';g.fillRect(-4,-10,690,20)}else{g.strokeStyle='#54dfff';g.globalAlpha=.35+Math.sin(frame*.5)*.25;g.lineWidth=2;g.strokeRect(0,-13,680,26)}g.restore()}
function drawBoss(){g.save();g.translate(320+(shake>0?Math.random()*4-2:0),133);g.fillStyle='#fff';g.beginPath();g.ellipse(0,-38,42,33,0,0,Math.PI*2);g.fill();g.fillRect(-28,-23,56,24);g.fillStyle='#080808';g.fillRect(-29,-51,19,18);g.fillRect(10,-51,19,18);g.fillRect(-5,-30,10,7);g.fillRect(-22,-13,44,5);for(let x=-17;x<=17;x+=9)g.fillRect(x,-12,2,10);if(phase==='attack'&&Math.floor(frame/20)%5===0){g.fillStyle='#39dfff';g.fillRect(13,-48,12,8)}g.fillStyle='#e4e5e9';g.fillRect(-42,14,84,38);g.fillStyle='#4d617a';g.fillRect(-28,15,56,36);g.fillStyle='#fff';g.fillRect(-40,17,12,40);g.fillRect(28,17,12,40);g.fillStyle='#161616';g.fillRect(-12,16,24,44);g.fillStyle='#eee';g.fillRect(-30,51,23,12);g.fillRect(7,51,23,12);g.restore()}
function drawHeart(){if(inv>0&&Math.floor(inv/3)%2===0)return;g.save();g.translate(H.x,H.y);if(H.blue)g.rotate([0,Math.PI/2,Math.PI,3*Math.PI/2][H.gravity]);g.fillStyle=H.blue?'#267eff':'#ff2828';g.beginPath();g.moveTo(0,9);g.bezierCurveTo(-20,-4,-9,-14,0,-6);g.bezierCurveTo(9,-14,20,-4,0,9);g.fill();g.restore()}
function draw(){g.fillStyle='#000';g.fillRect(0,0,640,480);g.save();if(shake>0)g.translate(Math.random()*5-2.5,Math.random()*5-2.5);drawBoss();if(miss>0)txt('MISS',320,86,20,'#fff','center');if(phase==='attack'){g.save();g.beginPath();g.rect(B.x,B.y,B.w,B.h);g.clip();for(let o of objects)if(o.kind==='bone')drawBone(o);for(let o of objects)if(o.kind==='platform'){g.fillStyle='#39d64a';g.fillRect(o.x,o.y,o.w,8);g.fillStyle='#d8ffd9';g.fillRect(o.x,o.y,o.w,2)}for(let o of objects)if(o.kind==='beam')drawBeam(o);drawHeart();g.restore();g.strokeStyle='white';g.lineWidth=5;g.strokeRect(B.x,B.y,B.w,B.h)}else{g.strokeStyle='white';g.lineWidth=5;g.strokeRect(60,235,520,135);if(phase==='menu')txt(dialog,85,284,17);if(phase==='fight'){txt('* MISS',260,285,26);txt('Zで つづける',90,335,16)}if(phase==='item')txt(items>0?'* かいふくアイテム  +35 HP   (Z)':'* アイテムが ない',85,287,18);if(phase==='dead')txt('GAME OVER  -  Zでリトライ',100,296,23,'#ff6666');if(phase==='win')txt('YOU WIN!',245,296,25)}g.restore();
txt('PLAYER',55,403,19);txt('LV 19',176,403,17);txt('HP',275,403,18);g.fillStyle='#a32123';g.fillRect(311,386,134,16);g.fillStyle='#f8dc32';g.fillRect(311,386,134*hp/92,16);if(kr>0){g.fillStyle='#c42f7e';g.fillRect(311+134*hp/92,386,134*kr/92,16)}txt(hp+' / 92',464,402,17);labels.forEach((label,i)=>{let x=42+i*150;g.strokeStyle=sel===i&&phase==='menu'?'#ffe66d':'#d18a2c';g.lineWidth=3;g.strokeRect(x,420,130,42);txt(label,x+65,448,21,sel===i&&phase==='menu'?'#ffe66d':'#d18a2c','center')});if(phase==='menu')txt('♥',47+sel*150,449,20,'#ff3030');if(phase==='attack')txt(attack===12?'FINAL PHASE':'WAVE '+String(turn).padStart(2,'0'),530,215,12,'#999');if(flash>0){g.fillStyle='rgba(255,0,0,.07)';g.fillRect(0,0,640,480)}}
let last=performance.now();function loop(now){let dt=(now-last)/16.667;last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function key(k,down){let was=!!keys[k];keys[k]=down;if(!down||was)return;if(k==='Enter'||k==='z'||k==='Z'||k===' '){command()}else if(phase==='menu'&&(k==='ArrowLeft'||k==='a'))sel=(sel+3)%4;else if(phase==='menu'&&(k==='ArrowRight'||k==='d'))sel=(sel+1)%4;else if((k==='x'||k==='X'||k==='Escape')&&phase==='item')phase='menu'}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();key(e.key,true)});window.addEventListener('keyup',e=>key(e.key,false));document.querySelectorAll('button[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(k,true)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>key(k,false))});
</script></body></html>
