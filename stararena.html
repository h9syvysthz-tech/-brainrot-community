<script>
(()=>{'use strict';
const NAMES=['ブレイズ','フロスト','ボルト','リーフ','シャドウ','ルナ','タイタン','スパーク','ウェーブ','ロック','ファング','コメット','ネオン','ミスト','フェニックス','ギア','ヴァイパー','スター','ゴーレム','ノヴァ'];

const HEROES=NAMES.map((name,i)=>({name,icon:ICONS[i],color:COLORS[i],hp:[310, 135, 215, 180, 285, 125, 270, 170, 325, 145, 235, 155, 300, 185, 245, 175, 280, 120, 260, 160][i],speed:[2.52, 1.62, 2.05, 1.88, 2.60, 1.52, 1.94, 1.91, 2.47, 1.58, 2.25, 1.78, 2.72, 1.64, 2.0, 1.83, 2.44, 1.49, 1.93, 1.7][i],bodySize:11+(i*5%8),damage:[46, 67, 25, 30, 43, 76, 34, 32, 49, 72, 36, 52, 55, 64, 33, 34, 45, 83, 39, 60][i],range:[76, 540, 225, 310, 105, 610, 195, 345, 90, 500, 165, 410, 65, 565, 205, 365, 112, 650, 180, 450][i],cooldown:[330, 990, 490, 550, 345, 1120, 520, 610, 310, 1040, 430, 840, 295, 980, 520, 580, 340, 1200, 540, 920][i],superType:i%5}));
const ROLE_NAMES=['近距離ファイター','長距離スナイパー','中距離バランス','中〜長距離アタッカー'];const ROLE_DESCS=['近距離で5発の散弾を放つ。近づくほど強力。','細くて高速な狙撃弾を遠距離まで飛ばす。接近戦は苦手。','射程と火力のバランスが良い。','中距離を保ちつつ牽制するタイプ。'];const ATTACKS=['灼熱散弾','氷結狙撃','電撃連鎖弾','葉の3連射','影の近距離連撃','月光貫通狙撃','重装破砕弾','流星2連射','水流散弾','岩石狙撃','牙の3連射','彗星加速弾','虹の8連散弾','霧の4連射','不死鳥の炎弾','機械2連射','猛毒散弾','星屑高速狙撃','巨岩範囲弾','宇宙貫通2連射'];

const ATTACK_CONFIG=[
[6,.19,.31,6.6,5,0],[1,0,1.16,16,2.5,0],[1,0,.92,8.4,5,0],[3,.11,.62,10,4,0],
[4,.23,.39,9,5,0],[1,0,1.05,15,3,2],[1,0,1.45,6.2,10,0],[2,.10,.82,11,5,0],
[7,.18,.25,7,4,0],[1,0,1.5,11,8,0],[3,.15,.63,9,5,0],[1,0,1.12,18,3,0],
[8,.17,.24,7.3,4,0],[4,.08,.52,10,4,0],[1,0,1.32,7.6,9,0],[2,.075,.78,13,4,0],
[5,.20,.35,7,5,0],[1,0,1.08,19,2.5,0],[1,0,1.65,6.5,10,0],[2,.09,.82,12,5,2]
];
const KEY='starArenaSave_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.owned)){data={coins:450,trophies:0,selected:0,owned:[0,1,2],levels:{},wins:0,matches:0,best:0}};const $=id=>document.getElementById(id);let tab='home',mode='royale',playing=false,raf=0,entities=[],shots=[],walls=[],bushes=[],particles=[],player=null,elapsed=0,spawnTimer=0,kills=0,score=0,last=0,mouse={x:480,y:300,active:false},keys={},move={x:0,y:0},attackHeld=false,superHeld=false,touchAim={active:false,dx:1,dy:0},gameTime=90,matchOver=false,teamScore=[0,0],effects=[],worldW=960,worldH=600,camX=0,camY=0,gasInset=0,gasPhase=0,bossWarnings=[],bossCooldown=0,bossPattern=0,killFeed=[];
// キャラ別の弾数と1発のリロード時間（秒）
const AMMO_CAP=[3,3,4,3,2,3,4,3,3,4,3,2,3,4,3,3,4,3,4,2];
const RELOAD_SEC=[0.8, 2.65, 1.35, 1.5, 0.72, 2.95, 1.45, 1.65, 0.78, 2.75, 1.12, 2.25, 0.65, 2.6, 1.5, 1.6, 0.82, 3.1, 1.48, 2.4];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const level=i=>data.levels[i]||1;const rank=()=>data.trophies<100?'ブロンズ':data.trophies<300?'シルバー':data.trophies<650?'ゴールド':data.trophies<1100?'ダイヤ':data.trophies<1800?'マスター':'レジェンド';const refresh=()=>{$('coins').textContent='🪙 '+data.coins;$('trophies').textContent='🏆 '+data.trophies};const btn=(label,fn,klass='')=>`<button class="btn ${klass}" data-act="${fn}">${label}</button>`;const h=i=>HEROES[i];const speedLabel=i=>h(i).speed>=2.32?'速い':h(i).speed>=1.96?'普通':'遅い';const sizeLabel=i=>h(i).bodySize>=24?'大型':h(i).bodySize>=19?'中型':'小型';const heroCard=i=>{let own=data.owned.includes(i);return `<button type="button" class="hero-tile ${data.selected===i?'current':''} ${own?'':'locked'}" data-act="detail:${i}" aria-label="${h(i).name}のステータスを見る"><span class="avatar">${h(i).icon}</span><b>${h(i).name}</b><span class="small">Lv.${level(i)} ${own?'':'🔒 未解放'}</span>${data.selected===i?'<span class="badge">✓ 選択中</span>':''}</button>`};

function showHeroDetail(i){if(!Number.isInteger(i)||i<0||i>=HEROES.length)return;const c=h(i),own=data.owned.includes(i),selected=data.selected===i;const role=c.range<=120?'超短射程':c.range<=205?'短〜中射程':c.range>=540?'超長射程':c.range>=400?'長射程':'中射程';const description=c.range<=120?'高速で接近して高火力を出す近距離特化。':c.range>=400?'遠距離から高威力で狙撃する。近づかれると不利。':'弾数・攻撃の広がり・貫通を活かして戦う。';$('detailPanel').innerHTML=`<button class="detail-close" data-detail="close" aria-label="閉じる">✕</button><div class="detail-top"><div class="detail-portrait">${c.icon}</div><div><div class="detail-name">${c.name}</div><div class="detail-tag">${role}</div><div class="small" style="margin-top:8px">Lv.${level(i)}　${own?'解放済み':'🔒 未解放'}</div></div></div><p class="muted">${description}</p><div class="detail-stats"><div class="detail-stat">❤️ 最大HP<strong>${c.hp+level(i)*12}</strong></div><div class="detail-stat">💥 攻撃力<strong>${c.damage+level(i)*3}</strong></div><div class="detail-stat">🎯 射程<strong>${c.range}</strong></div><div class="detail-stat">👟 移動速度<strong>${c.speed.toFixed(2)}</strong></div><div class="detail-stat">🔋 最大弾数<strong>${AMMO_CAP[i]} 発</strong></div><div class="detail-stat">⏱️ リロード<strong>${RELOAD_SEC[i]} 秒/発</strong></div></div><div class="detail-move"><b>🎯 通常攻撃：${ATTACKS[i]}</b><p class="small">特徴：${SPECIAL[i]}</p></div><div class="detail-move"><b>⚡ 必殺技：${attackLabel(i)}</b></div><div class="detail-actions">${own?(selected?'<button class="btn green" disabled>✓ 選択中</button>':`<button class="btn green" data-detail="choose:${i}">このキャラを選択</button>`):'<button class="btn" disabled>🔒 未解放</button>'}<button class="btn red" data-detail="close">戻る</button></div>`;$('heroDetail').classList.add('open');}

ctx.strokeStyle='#ffcf7e';ctx.lineWidth=3;ctx.strokeRect(bx,by,bw,bh);
ctx.textAlign='center';ctx.font='bold 17px system-ui';ctx.fillStyle='#fff';ctx.fillText('👹 巨大ボス Lv.'+boss.lv+'   '+Math.ceil(boss.hp)+' / '+boss.maxhp,480,36);
ctx.font='bold 13px system-ui';ctx.fillStyle='#a8e8ff';ctx.fillText('味方 '+entities.filter(e=>e.team===0&&!e.dead).length+'/3 人 生存  ·  全滅すると敗北',480,67);
}
if(player.dead){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 25px system-ui';ctx.fillText('復活まで '+Math.max(0,Math.ceil(player.respawn-elapsed))+'秒',480,116)}
}if(mode==='team'){ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('🔵 '+teamScore[0]+' - '+teamScore[1]+' 🔴  R'+knockoutRound,940,63);if(roundBreak>0){ctx.textAlign='center';ctx.font='bold 31px system-ui';ctx.fillStyle='#ffdc6c';ctx.fillText('次のラウンドまで '+Math.ceil(roundBreak)+'秒',480,125)}else if(player.dead){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.fillText('観戦中・次のラウンドまで復活なし',480,112)}}// 左上のキルログとバトルロイヤル生存人数
ctx.save();
const feedX=14,feedY=mode==='royale'?194:166;
if(mode==='royale'){
 const alive=entities.filter(e=>!e.dead).length;
 ctx.fillStyle='rgba(9,18,42,.86)';ctx.fillRect(feedX,143,220,38);
 ctx.textAlign='left';ctx.font='bold 21px system-ui';ctx.fillStyle='#ffe17a';
 ctx.fillText('👑 残り '+alive+' 人',feedX+12,169);
}
let visibleFeed=killFeed.filter(item=>elapsed-item.time<7).slice(0,4);
for(let i=0;i<visibleFeed.length;i++){
 const item=visibleFeed[i],y=feedY+i*32;
 ctx.globalAlpha=Math.min(1,(7-(elapsed-item.time))/1.1);
 ctx.fillStyle='rgba(9,18,42,.84)';ctx.fillRect(feedX,y-23,310,29);
 ctx.textAlign='left';ctx.font='bold 13px system-ui';
 ctx.fillStyle=item.killerColor;ctx.fillText(item.killer.slice(0,11),feedX+9,y-5);
 ctx.fillStyle='#ffdf68';ctx.fillText('⚔',feedX+136,y-5);
 ctx.fillStyle=item.victimColor;ctx.fillText(item.victim.slice(0,11),feedX+163,y-5);
}
ctx.restore();
$('status').textContent=mode==='royale'?'残り '+entities.filter(e=>!e.dead).length+'人':mode==='boss'?'ボス討伐':'撃破 '+kills}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(playing)raf=requestAnimationFrame(loop)}
function finish(win){if(matchOver)return;matchOver=true;playing=false;cancelAnimationFrame(raf);attackHeld=false;superHeld=false;let reward=20+kills*18+(win?100:0),cups=win?25+kills*2:Math.max(-10,kills*2-8);data.coins+=reward;data.trophies=Math.max(0,data.trophies+cups);data.matches++;if(win)data.wins++;data.best=Math.max(data.best,score);save();$('overlay').style.display='flex';$('result').innerHTML=`<div style="font-size:55px">${win?'🏆':'💥'}</div><h1>${win?'勝利！':'バトル終了'}</h1><p>撃破数：${kills} ／ スコア：${score}</p><h2>🪙 +${reward}　🏆 ${cups>=0?'+':''}${cups}</h2>${btn('ホームに戻る','back','orange')}`;$('result').querySelector('button').onclick=back;document.body.classList.remove('playing')}
function back(){playing=false;cancelAnimationFrame(raf);$('overlay').style.display='none';$('gameArea').style.display='none';$('menu').style.display='block';document.body.classList.remove('playing');attackHeld=false;superHeld=false;mouse.active=false;render()}
$('leave').onclick=()=>{if(confirm('バトルを退出しますか？ 報酬は獲得できません。'))back()};$('battleExit').onclick=()=>{$('leave').click()};
window.addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&playing)e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&playing){superHeld=true;e.preventDefault()}});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*960/r.width;mouse.y=(e.clientY-r.top)*600/r.height;mouse.active=true}});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){attackHeld=true;doAttack()}else{mouse.active=false}});window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')attackHeld=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
const joy=$('moveJoy'),knob=joy.querySelector('.knob');let joyId=null;function joyUpdate(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),n=norm(x,y),d=Math.min(Math.hypot(x,y),r.width*.32);move.x=n.x*d/(r.width*.32);move.y=n.y*d/(r.width*.32);knob.style.transform=`translate(${n.x*d}px,${n.y*d}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);joyUpdate(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyUpdate(e)});function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;move={x:0,y:0};knob.style.transform=''}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
const attackBtn=$('attackBtn');
let attackPointer=null,attackStart=null,attackDragged=false;
function aimDrag(e){
 if(e.pointerId!==attackPointer||!attackStart)return;
 let dx=e.clientX-attackStart.x,dy=e.clientY-attackStart.y;
 if(Math.hypot(dx,dy)>16){attackDragged=true;let n=norm(dx,dy);touchAim={active:true,dx:n.x,dy:n.y};}
}
attackBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();if(attackPointer!==null)return;
 attackPointer=e.pointerId;attackStart={x:e.clientX,y:e.clientY};attackDragged=false;
 touchAim.active=false;attackHeld=false;mouse.active=false;
 attackBtn.setPointerCapture(e.pointerId);
});
attackBtn.addEventListener('pointermove',e=>{e.preventDefault();aimDrag(e)});
function releaseAttack(e){
 if(e.pointerId!==attackPointer)return;
 e.preventDefault();aimDrag(e);
 if(e.type==='pointerup'&&playing&&!player.dead){
   if(attackDragged)doAttack(false,{x:touchAim.dx,y:touchAim.dy});
   else doAttack();
 }
 attackPointer=null;attackStart=null;attackDragged=false;touchAim.active=false;attackHeld=false;
}
attackBtn.addEventListener('pointerup',releaseAttack);
attackBtn.addEventListener('pointercancel',releaseAttack);
attackBtn.addEventListener('lostpointercapture',e=>{if(e.pointerId===attackPointer){attackPointer=null;attackStart=null;touchAim.active=false;attackHeld=false}});
let superAim={active:false,dx:1,dy:0},superPointer=null,superStart=null,superDragged=false;
const superBtn=$('superBtn');
superBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(superPointer!==null)return;superPointer=e.pointerId;superStart={x:e.clientX,y:e.clientY};superDragged=false;superAim.active=false;mouse.active=false;superBtn.setPointerCapture(e.pointerId)});
superBtn.addEventListener('pointermove',e=>{if(e.pointerId!==superPointer)return;e.preventDefault();let dx=e.clientX-superStart.x,dy=e.clientY-superStart.y;if(Math.hypot(dx,dy)>16){let n=norm(dx,dy);superAim={active:true,dx:n.x,dy:n.y};superDragged=true}});
superBtn.addEventListener('pointerup',e=>{if(e.pointerId!==superPointer)return;e.preventDefault();if(playing&&!player.dead){if(superDragged)doAttack(true,{x:superAim.dx,y:superAim.dy});else doAttack(true)}superPointer=null;superStart=null;superAim.active=false});
superBtn.addEventListener('pointercancel',()=>{superPointer=null;superStart=null;superAim.active=false});
superBtn.addEventListener('lostpointercapture',()=>{superPointer=null;superStart=null;superAim.active=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){attackHeld=false;attackPointer=null;touchAim.active=false;superPointer=null;superAim.active=false;move={x:0,y:0};keys={}}});render();
})();
</script></body></html>
